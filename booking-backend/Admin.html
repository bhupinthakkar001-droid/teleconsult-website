<!doctype html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{--green:#21634c;--ink:#19362d;--muted:#68776f;--line:#dfe8e1;--bg:#f4f7f4}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
    .wrap{max-width:680px;margin:auto;padding:18px 14px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 18px}
    h1{font-size:23px;letter-spacing:-.5px;margin:0}h2{font-size:17px;margin:0 0 12px}
    .muted{color:var(--muted);font-size:13px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 3px 14px #19362d08}
    input{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;font:inherit;margin:8px 0 12px}
    button{border:0;border-radius:12px;padding:12px 15px;font:700 14px system-ui;cursor:pointer}
    .primary{background:var(--green);color:white}.secondary{background:#e8f0ea;color:var(--ink)}.danger{background:#fff0ee;color:#a33b31}
    .full{width:100%}.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1}
    .pill{font-size:12px;font-weight:750;border-radius:99px;padding:4px 9px;background:#fff2d8;color:#8b5b08}
    .meta{font-size:13px;color:var(--muted);margin:3px 0}.name{font-size:17px;font-weight:750;margin-bottom:2px}
    .empty{text-align:center;color:var(--muted);padding:20px 8px}.hidden{display:none!important}
    .tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1;background:#e8eee9;color:var(--ink)}.tabs button.active{background:var(--green);color:white}
    .error{color:#a33b31;font-size:13px;margin:8px 0}.success{color:var(--green);font-size:13px;margin:8px 0}
    a{color:var(--green);font-weight:700;overflow-wrap:anywhere}.small{font-size:12px}
    a.action{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border-radius:12px;padding:12px 15px;font:700 14px system-ui;flex:1}
    a.action.primary{background:var(--green);color:white}
    a.action.whatsapp{background:#e5f5e9;color:#176b38;border:1px solid #bfe5c9}
    .slot-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .field-label{display:block;font-size:13px;font-weight:700;margin-top:4px}
    .slot-form-actions{display:flex;gap:8px;margin-top:8px}
    .slot-form-actions button{flex:1}
    .slot-actions{display:flex;gap:8px;margin-top:12px}
    .slot-actions button{flex:1}
    .intake-details{margin:12px 0;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#f8faf8}
    .intake-details summary{font-size:13px;font-weight:750;color:var(--green);cursor:pointer}
    .intake-body{display:grid;gap:9px;margin-top:12px;font-size:13px}
    .intake-body strong{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
    .intake-body p{white-space:pre-wrap;margin:0;color:var(--ink);overflow-wrap:anywhere}
    .priority-card{border:2px solid #d18b32;background:#fffdf8}
    .priority-label{display:inline-flex;align-items:center;background:#fff0d5;color:#89520b;border-radius:99px;padding:5px 10px;font-size:11px;font-weight:800}
    .priority-meta{color:#89520b;font-size:13px;font-weight:750;margin:7px 0}
    @media(max-width:420px){.slot-grid{grid-template-columns:1fr}.slot-form-actions{flex-direction:column}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><h1>Doctor Dashboard</h1><div class="muted">Teleconsult appointments</div></div><button id="logout" class="secondary hidden" onclick="logout()">Log out</button></div>
  <section id="login" class="card">
    <h2>Doctor sign in</h2><div class="muted">Private access for Dr. Bhupin</div>
    <form onsubmit="event.preventDefault();login()">
      <input id="password" type="password" autocomplete="current-password" placeholder="Dashboard password" required>
      <button class="primary full" id="loginBtn">Sign in</button>
    </form><div id="loginError" class="error"></div>
  </section>
  <section id="dashboard" class="hidden">
    <div class="row" style="margin:10px 0 14px">
      <div class="card" style="flex:1;margin:0"><div class="muted">Pending</div><div id="pendingCount" style="font-size:28px;font-weight:800">0</div></div>
      <div class="card" style="flex:1;margin:0"><div class="muted">Confirmed</div><div id="confirmedCount" style="font-size:28px;font-weight:800">0</div></div>
    </div>
    <div class="card" id="priorityControl" style="margin:0 0 14px">
      <div class="row" style="justify-content:space-between;align-items:center;gap:12px">
        <div><strong>Priority response option</strong><div id="priorityStatus" class="muted">Checking availability…</div></div>
        <button id="priorityToggleBtn" class="secondary" type="button" onclick="togglePriorityBookings()" disabled>Loading…</button>
      </div>
    </div>
    <div class="tabs"><button id="pendingTab" class="active" onclick="showTab('pending')">Pending</button><button id="confirmedTab" onclick="showTab('confirmed')">Confirmed</button><button id="changesTab" onclick="showTab('changes')">Change requests</button><button id="slotsTab" onclick="showTab('slots')">Manage slots</button></div>
    <div id="notice" class="muted" style="margin:8px 2px"></div>
    <div id="requestList"></div>
    <button id="requestRefresh" class="secondary full" onclick="loadRequests()">Refresh appointments</button>
    <section id="changePanel" class="hidden">
      <div id="changeResult" class="muted" style="margin:8px 2px"></div>
      <div id="changeList"></div>
      <button class="secondary full" type="button" onclick="loadChangeRequests()">Refresh change requests</button>
    </section>
    <section id="slotPanel" class="hidden">
      <div class="card">
        <h2 id="slotFormTitle">Add appointment slots</h2>
        <div class="muted">Choose a future date and time. Patients will see slots marked AVAILABLE.</div>
        <div class="slot-grid">
          <div><label class="field-label" for="slotDate">Appointment date</label><input id="slotDate" type="date"></div>
          <div><label class="field-label" for="slotTime">Appointment time</label><input id="slotTime" type="time"></div>
        </div>
        <div class="slot-form-actions">
          <button id="saveSlotBtn" class="primary" type="button" onclick="saveSlot()">Add available slot</button>
          <button id="cancelEditBtn" class="secondary hidden" type="button" onclick="resetSlotForm()">Cancel edit</button>
        </div>
        <div id="slotFormMessage" class="error"></div>
      </div>
      <div id="slotList"></div>
      <button class="secondary full" type="button" onclick="loadSlots()">Refresh slots</button>
    </section>
  </section>
</div>
<script>
let sessionToken='', currentTab='pending', data={pending:[],confirmed:[]}, slotsData=[], editingSlotId='', changeRequests=[], priorityEnabled=true;
function showError(id,msg){document.getElementById(id).textContent=msg||''}
function login(){
  const btn=document.getElementById('loginBtn');btn.disabled=true;btn.textContent='Signing in…';showError('loginError','');
  google.script.run.withSuccessHandler(r=>{sessionToken=r.token;document.getElementById('login').classList.add('hidden');document.getElementById('dashboard').classList.remove('hidden');document.getElementById('logout').classList.remove('hidden');document.getElementById('slotDate').min=localDateString();loadRequests();loadPrioritySettings();})
    .withFailureHandler(e=>{showError('loginError',e.message||String(e));btn.disabled=false;btn.textContent='Sign in';})
    .adminLogin(document.getElementById('password').value);
}
function logout(){sessionToken='';document.getElementById('dashboard').classList.add('hidden');document.getElementById('logout').classList.add('hidden');document.getElementById('login').classList.remove('hidden');document.getElementById('password').value='';}
function updatePriorityControl(){
  const status=document.getElementById('priorityStatus');
  const button=document.getElementById('priorityToggleBtn');
  if(priorityEnabled){
    status.textContent='ON · Patients can select ₹2,000 priority response consultations.';
    button.textContent='Turn OFF';
    button.className='danger';
  }else{
    status.textContent='OFF · Only regular ₹500 consultations are being offered.';
    button.textContent='Turn ON';
    button.className='primary';
  }
  button.disabled=false;
}
function loadPrioritySettings(){
  const button=document.getElementById('priorityToggleBtn');
  button.disabled=true;button.textContent='Loading…';
  google.script.run.withSuccessHandler(r=>{
    priorityEnabled=!!r.priorityEnabled;
    updatePriorityControl();
  }).withFailureHandler(e=>{
    document.getElementById('priorityStatus').textContent=e.message||String(e);
    button.textContent='Retry';
    button.disabled=false;
    button.className='secondary';
  }).adminGetPrioritySettings(sessionToken);
}
function togglePriorityBookings(){
  const next=!priorityEnabled;
  const prompt=next
    ? 'Turn ON the ₹2,000 priority response option for patients?'
    : 'Turn OFF the priority response option? Patients will only see regular booking.';
  if(!confirm(prompt))return;
  const button=document.getElementById('priorityToggleBtn');
  button.disabled=true;button.textContent='Updating…';
  google.script.run.withSuccessHandler(r=>{
    priorityEnabled=!!r.priorityEnabled;
    updatePriorityControl();
    document.getElementById('priorityStatus').textContent=r.message;
  }).withFailureHandler(e=>{
    button.disabled=false;
    updatePriorityControl();
    document.getElementById('priorityStatus').textContent=e.message||String(e);
  }).adminSetPriorityBookingsEnabled(sessionToken,next);
}
function showTab(tab){
  currentTab=tab;
  document.getElementById('pendingTab').classList.toggle('active',tab==='pending');
  document.getElementById('confirmedTab').classList.toggle('active',tab==='confirmed');
  document.getElementById('changesTab').classList.toggle('active',tab==='changes');
  document.getElementById('slotsTab').classList.toggle('active',tab==='slots');
  document.getElementById('requestList').classList.toggle('hidden',tab==='slots'||tab==='changes');
  document.getElementById('requestRefresh').classList.toggle('hidden',tab==='slots'||tab==='changes');
  document.getElementById('slotPanel').classList.toggle('hidden',tab!=='slots');
  document.getElementById('changePanel').classList.toggle('hidden',tab!=='changes');
  if(tab==='slots')loadSlots();else if(tab==='changes')loadChangeRequests();else render();
}
function loadRequests(successNotice){
  document.getElementById('notice').textContent='Loading appointments…';
  google.script.run.withSuccessHandler(r=>{data=r;document.getElementById('pendingCount').textContent=r.pending.length;document.getElementById('confirmedCount').textContent=r.confirmed.length;document.getElementById('notice').innerHTML=successNotice||'';render();})
    .withFailureHandler(e=>{document.getElementById('notice').textContent=e.message||String(e);if((e.message||'').includes('session expired'))logout();})
    .adminGetRequests(sessionToken);
}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function priorityDeadlineText(requestedAt){
  const raw=String(requestedAt||'').trim();
  if(!raw)return 'Received time unavailable';
  const received=new Date(raw.replace(' ','T')+'+05:30');
  if(isNaN(received.getTime()))return 'Received: '+raw;
  const deadline=new Date(received.getTime()+30*60*1000);
  const time=new Intl.DateTimeFormat('en-IN',{hour:'numeric',minute:'2-digit',timeZone:'Asia/Kolkata'}).format(deadline);
  return Date.now()>deadline.getTime()?'30-minute response target passed (due '+time+')':'30-minute response target · respond by '+time;
}
function render(){
  if(currentTab==='slots'||currentTab==='changes')return;
  const items=data[currentTab]||[], root=document.getElementById('requestList');
  if(!items.length){root.innerHTML='<div class="card empty">No '+currentTab+' appointments.</div>';return;}
  root.innerHTML=items.map(x=>{
    const isPriority=x.serviceLevel==='PRIORITY';
    const cardClass=isPriority?'card priority-card':'card';
    const service='<div class="row" style="align-items:center;gap:8px;margin:6px 0">'+
      (isPriority?'<span class="priority-label">PRIORITY RESPONSE</span>':'')+
      '<span class="meta">Fee: ₹'+esc(x.consultationFee|| (isPriority?'2000':'500'))+'</span></div>'+
      (isPriority?'<div class="priority-meta">'+esc(priorityDeadlineText(x.requestedAt))+' · Subject to doctor availability</div>':'');
    let actions='';
    if(currentTab==='confirmed' && x.videoLink){
      const phone=normalisePhone(x.patientPhone);
      const msg=confirmationMessage(x);
      const wa='https://wa.me/'+phone+'?text='+encodeURIComponent(msg);
      actions='<div class="row" style="margin-top:14px">'+
        '<a class="action primary" target="_blank" rel="noopener" href="'+esc(x.videoLink)+'">Open Google Meet</a>'+
        '<a class="action whatsapp" target="_blank" rel="noopener" href="'+esc(wa)+'">Send WhatsApp</a>'+
        '<button class="secondary" type="button" onclick="copySms(\''+esc(x.requestId)+'\')">Copy SMS message</button>'+
        '</div>';
    } else if(currentTab==='confirmed') {
      actions='<p class="meta">Meet link is not available for this appointment. Please check the Requests sheet.</p>';
    } else {
      const approveText=isPriority?'Accept priority & create Meet':'Approve & create Meet';
      actions='<div class="row" style="margin-top:14px"><button class="primary" onclick="decide(\''+esc(x.requestId)+'\',true)">'+approveText+'</button><button class="danger" onclick="decide(\''+esc(x.requestId)+'\',false)">Decline</button></div>';
    }
    const intake='<details class="intake-details"><summary>Patient intake details</summary><div class="intake-body">'+
      '<div><strong>Presenting complaint & duration</strong><p>'+esc(x.presentingComplaint||'Not recorded for this booking.')+'</p></div>'+
      '<div><strong>Existing diseases / past medical history</strong><p>'+esc(x.medicalHistory||'Not provided')+'</p></div>'+
      '<div><strong>Telemedicine consent</strong><p>'+(x.onlineConsultConsent==='YES'?'Recorded':'Not recorded for this booking')+(x.consentAt?' · '+esc(x.consentAt):'')+'</p></div>'+
      '<div><strong>Health information use consent</strong><p>'+(x.dataUseConsent==='YES'?'Recorded':'Not recorded for this booking')+(x.dataConsentAt?' · '+esc(x.dataConsentAt):'')+'</p></div>'+
      '<div><strong>Consent wording version</strong><p>'+esc(x.consentVersion||'Older booking / version not recorded')+'</p></div>'+
      '</div></details>';
    return '<article class="'+cardClass+'"><div class="row" style="justify-content:space-between;align-items:center"><div class="name">'+esc(x.patientName)+'</div><span class="pill">'+esc(x.status)+'</span></div><div class="meta">'+esc(x.date)+' · '+esc(x.time)+'</div><div class="meta">'+esc(x.visitType)+'</div><div class="meta">Mobile: '+esc(x.patientPhone)+'</div><div class="meta small">Request ID: '+esc(x.requestId)+'</div>'+service+intake+actions+'</article>';
  }).join('');
}
function loadChangeRequests(){
  document.getElementById('notice').textContent='Loading change requests…';
  google.script.run.withSuccessHandler(r=>{
    changeRequests=r.pending||[];
    document.getElementById('notice').textContent=changeRequests.length+' pending change request(s).';
    renderChangeRequests();
  }).withFailureHandler(e=>{
    document.getElementById('notice').textContent=e.message||String(e);
    if((e.message||'').toLowerCase().includes('session expired'))logout();
  }).adminGetChangeRequests(sessionToken);
}
function renderChangeRequests(){
  const root=document.getElementById('changeList');
  if(!changeRequests.length){root.innerHTML='<div class="card empty">No pending cancellation or rescheduling requests.</div>';return;}
  root.innerHTML=changeRequests.map(x=>{
    const reschedule=x.changeType==='RESCHEDULE';
    const requested=reschedule?'<div class="meta"><strong>Requested new time:</strong> '+esc(x.newDate)+' · '+esc(x.newTime)+'</div>':'<div class="meta"><strong>Requested action:</strong> Cancel appointment</div>';
    return '<article class="card"><div class="name">'+esc(x.patientName)+'</div>'+
      '<div class="meta">Current booking ID: '+esc(x.requestId)+'</div>'+
      '<div class="meta">Patient mobile: '+esc(x.patientPhone)+'</div>'+
      '<div class="meta">Current appointment: '+esc(x.currentDate)+' · '+esc(x.currentTime)+'</div>'+
      '<div class="meta">Request type: '+(reschedule?'Reschedule':'Cancellation')+'</div>'+requested+
      '<div class="row" style="margin-top:14px"><button class="primary" type="button" onclick="decideChange(\''+esc(x.changeId)+'\',true)">Approve request</button><button class="danger" type="button" onclick="decideChange(\''+esc(x.changeId)+'\',false)">Decline request</button></div></article>';
  }).join('');
}
function decideChange(changeId,approve){
  const action=approve?'approve this change request':'decline this change request';
  if(!confirm('Are you sure you want to '+action+'?'))return;
  const result=document.getElementById('changeResult');
  result.textContent=approve?'Processing change request…':'Declining change request…';
  google.script.run.withSuccessHandler(r=>{
    const name=r.patientName||'there';
    let message;
    if(!approve){
      message='Hello '+name+', your request to change your appointment could not be approved. Your original appointment remains scheduled for '+r.date+' at '+r.time+'. Please contact the doctor if you need help.';
    } else if(r.changeType==='CANCEL'){
      message='Hello '+name+', your appointment with Dr. Bhupin on '+r.date+' at '+r.time+' has been cancelled as requested.';
    } else {
      message='Hello '+name+', your appointment with Dr. Bhupin has been rescheduled to '+r.date+' at '+r.time+'. Your new Google Meet link is '+r.meetLink+'. Please use this new link.';
    }
    const phone=String(r.patientPhone||'');
    const wa='https://wa.me/'+phone+'?text='+encodeURIComponent(message);
    result.innerHTML=esc(r.message||'Change request processed.')+' &nbsp; <a target="_blank" rel="noopener" href="'+esc(wa)+'">Open WhatsApp message to patient</a>';
    loadRequests();
    loadChangeRequests();
  }).withFailureHandler(e=>{
    result.textContent=e.message||String(e);
  }).adminDecideChangeRequest(sessionToken,changeId,approve);
}
function localDateString(){
  const d=new Date(),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}
function loadSlots(successMessage){
  document.getElementById('notice').textContent='Loading appointment slots…';
  google.script.run.withSuccessHandler(r=>{
    slotsData=r.slots||[];
    document.getElementById('notice').textContent=successMessage||'';
    renderSlots();
  }).withFailureHandler(e=>{
    document.getElementById('notice').textContent=e.message||String(e);
    if((e.message||'').toLowerCase().includes('session expired'))logout();
  }).adminGetSlots(sessionToken);
}
function renderSlots(){
  const root=document.getElementById('slotList');
  if(!slotsData.length){root.innerHTML='<div class="card empty">No upcoming slots. Add your first appointment slot above.</div>';return;}
  root.innerHTML=slotsData.map(x=>{
    const available=x.status==='AVAILABLE';
    const controls=available
      ? '<div class="slot-actions"><button class="secondary" type="button" onclick="editSlot(\''+esc(x.slotId)+'\')">Edit</button><button class="danger" type="button" onclick="removeSlot(\''+esc(x.slotId)+'\')">Remove</button></div>'
      : '<div class="meta small">This slot is locked because it has a '+(x.status==='PENDING'?'pending request':(x.status==='CHANGE_PENDING'?'pending reschedule request':'confirmed appointment'))+'. Manage it from the appointment tabs.</div>';
    return '<article class="card"><div class="row" style="justify-content:space-between;align-items:center"><div class="name">'+esc(x.date)+'</div><span class="pill">'+esc(x.status)+'</span></div><div class="meta">'+esc(x.time)+'</div>'+controls+'</article>';
  }).join('');
}
function saveSlot(){
  const date=document.getElementById('slotDate').value;
  const time=document.getElementById('slotTime').value;
  const btn=document.getElementById('saveSlotBtn');
  if(!date||!time){document.getElementById('slotFormMessage').textContent='Please select both a date and time.';return;}
  btn.disabled=true;btn.textContent=editingSlotId?'Saving changes…':'Adding slot…';
  document.getElementById('slotFormMessage').textContent='';
  const success=r=>{
    btn.disabled=false;
    resetSlotForm();
    loadSlots(r.message||'Slot saved successfully.');
  };
  const failure=e=>{
    btn.disabled=false;
    btn.textContent=editingSlotId?'Save changes':'Add available slot';
    document.getElementById('slotFormMessage').textContent=e.message||String(e);
  };
  const runner=google.script.run.withSuccessHandler(success).withFailureHandler(failure);
  if(editingSlotId)runner.adminUpdateSlot(sessionToken,editingSlotId,date,time);
  else runner.adminAddSlot(sessionToken,date,time);
}
function editSlot(slotId){
  const slot=slotsData.find(x=>String(x.slotId)===String(slotId));
  if(!slot||slot.status!=='AVAILABLE')return;
  editingSlotId=slot.slotId;
  document.getElementById('slotDate').value=slot.date;
  const m=String(slot.time).match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
  if(m){
    let h=Number(m[1])%12;if(m[3].toUpperCase()==='PM')h+=12;
    document.getElementById('slotTime').value=String(h).padStart(2,'0')+':'+m[2];
  }else document.getElementById('slotTime').value=slot.time;
  document.getElementById('slotFormTitle').textContent='Edit appointment slot';
  document.getElementById('saveSlotBtn').textContent='Save changes';
  document.getElementById('cancelEditBtn').classList.remove('hidden');
  document.getElementById('slotFormMessage').textContent='Editing '+slot.date+' at '+slot.time+'.';
  window.scrollTo(0,0);
}
function resetSlotForm(){
  editingSlotId='';
  document.getElementById('slotDate').value='';
  document.getElementById('slotTime').value='';
  document.getElementById('slotFormTitle').textContent='Add appointment slots';
  document.getElementById('saveSlotBtn').textContent='Add available slot';
  document.getElementById('saveSlotBtn').disabled=false;
  document.getElementById('cancelEditBtn').classList.add('hidden');
  document.getElementById('slotFormMessage').textContent='';
}
function removeSlot(slotId){
  if(!confirm('Remove this available slot? Patients will no longer see it.'))return;
  document.getElementById('notice').textContent='Removing slot…';
  google.script.run.withSuccessHandler(r=>loadSlots(r.message||'Slot removed.'))
    .withFailureHandler(e=>document.getElementById('notice').textContent=e.message||String(e))
    .adminDeleteSlot(sessionToken,slotId);
}
function normalisePhone(value){
  let digits=String(value||'').replace(/\\D/g,'');
  if(digits.length===10)digits='91'+digits;
  else if(digits.length===11 && digits.charAt(0)==='0')digits='91'+digits.slice(1);
  return digits;
}
function confirmationMessage(x){
  const priority=x.serviceLevel==='PRIORITY';
  const fee=x.consultationFee||(priority?'2000':'500');
  return 'Hello '+(x.patientName||'')+', your '+(priority?'priority response ':'')+'video consultation with Dr. Bhupin is confirmed. Date: '+x.date+'. Time: '+x.time+'. Appointment: '+(x.visitType||'Video consultation')+'. Consultation fee: ₹'+fee+'. Join using this Google Meet link: '+x.videoLink+'. Please open the link at the appointment time.';
}
function copySms(requestId){
  const x=(data.confirmed||[]).find(item=>String(item.requestId)===String(requestId));
  if(!x)return;
  const message=confirmationMessage(x);
  const fallback=()=>{
    const area=document.createElement('textarea');area.value=message;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.focus();area.select();
    try{document.execCommand('copy');document.getElementById('notice').textContent='SMS message copied. Paste it into your phone Messages app and send it to '+x.patientPhone+'.';}
    catch(e){document.getElementById('notice').textContent='Copy failed. Please select and copy the message manually.';}
    area.remove();
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(message).then(()=>{document.getElementById('notice').textContent='SMS message copied. Paste it into your phone Messages app and send it to '+x.patientPhone+'.';}).catch(fallback);
  } else fallback();
}
function decide(id,approve){
  const label=approve?'approve this appointment and create a Google Meet link':'decline this appointment and release its slot';
  if(!confirm('Are you sure you want to '+label+'?'))return;
  document.getElementById('notice').textContent=approve?'Creating Google Meet and confirming…':'Declining appointment…';
  const runner=google.script.run.withSuccessHandler(r=>{
    if(approve){
      showTab('confirmed');
      const msg='Hello '+(r.patientName||'')+', your video consultation with Dr. Bhupin is confirmed. Date: '+r.date+'. Time: '+r.time+'. Join using this Google Meet link: '+r.meetLink;
      const meetLink='<a target="_blank" rel="noopener" href="'+esc(r.meetLink)+'">Open Google Meet</a>';
      const whatsappLink='<a target="_blank" rel="noopener" href="https://wa.me/'+encodeURIComponent(r.patientPhone)+'?text='+encodeURIComponent(msg)+'">Send WhatsApp confirmation</a>';
      loadRequests('Appointment confirmed successfully. '+meetLink+' &nbsp;·&nbsp; '+whatsappLink);
    } else {
      loadRequests('Appointment declined and slot released.');
    }
  }).withFailureHandler(e=>{document.getElementById('notice').textContent=e.message||String(e);});
  if(approve)runner.adminApproveRequest(sessionToken,id);else runner.adminDeclineRequest(sessionToken,id);
}
</script>
</body></html>
